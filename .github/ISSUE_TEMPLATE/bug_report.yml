name: Bug report
description: Something in Xenia doesn't work as it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a conversation with...
        2. ...
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options:
        - iPhone
        - Mac
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Xenia version (Settings > About) and iOS or macOS version.
      placeholder: Xenia 1.0 (1), iOS 27.1
  - type: input
    id: server
    attributes:
      label: Homeserver
      description: matrix.org, a self-hosted Synapse, the local test server... No account names needed.
  - type: textarea
    id: logs
    attributes:
      label: Screenshots or logs
      description: Leave out anything private, such as message text, room names and user IDs.
