name: Feature request
description: Something Xenia should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you're trying to do
      description: The situation and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: How it could work. Mention another app if it does this well.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options:
        - iPhone
        - Mac
